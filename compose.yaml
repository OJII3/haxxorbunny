services:
  bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: bot-sekai
    env_file: .env
    volumes:
      - bot-data:/app/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: bot-sekai-searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: bot-sekai-voicevox
    ports:
      - "50021:50021"
    restart: unless-stopped

  moonshine:
    build:
      context: ./moonshine
      dockerfile: Containerfile
    container_name: bot-sekai-moonshine
    ports:
      - "8090:8090"
    volumes:
      - moonshine-models:/models
    restart: unless-stopped

volumes:
  bot-data:
  moonshine-models:
