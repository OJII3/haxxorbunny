services:
  bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: haxxorbunny
    env_file: .env
    volumes:
      - bot-data:/app/data
    depends_on:
      - aiclient
    restart: unless-stopped

  aiclient:
    image: justlikemaki/aiclient-2-api
    container_name: haxxorbunny-aiclient
    ports:
      - "3001:3000"
      - "8085:8085"
      - "8086:8086"
    volumes:
      - aiclient-configs:/app/configs
      - ${HOME}/.gemini:/root/.gemini:ro
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: haxxorbunny-voicevox
    ports:
      - "50021:50021"
    restart: unless-stopped

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: haxxorbunny-whisper
    ports:
      - "8080:8080"
    command: ["whisper-server", "--model", "/models/ggml-small.bin", "--port", "8080", "--host", "0.0.0.0"]
    volumes:
      - whisper-models:/models
    restart: unless-stopped

volumes:
  bot-data:
  aiclient-configs:
  whisper-models:
