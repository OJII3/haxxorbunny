services:
  bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: haxxerbunny
    env_file: .env
    volumes:
      - bot-data:/app/data
    depends_on:
      - aiclient
    restart: unless-stopped

  aiclient:
    image: justlikemaki/aiclient-2-api
    container_name: haxxerbunny-aiclient
    ports:
      - "3000:3000"
    volumes:
      - aiclient-configs:/app/configs
    restart: unless-stopped

volumes:
  bot-data:
  aiclient-configs:
