services:
  bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: haxxorbunny
    env_file: .env
    volumes:
      - bot-data:/app/data
    depends_on:
      - aiclient
    restart: unless-stopped

  aiclient:
    image: justlikemaki/aiclient-2-api
    container_name: haxxorbunny-aiclient
    ports:
      - "3001:3000"
      - "8085:8085"
      - "8086:8086"
    volumes:
      - aiclient-configs:/app/configs
      - ${HOME}/.gemini:/root/.gemini:ro
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: haxxorbunny-searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: haxxorbunny-voicevox
    ports:
      - "50021:50021"
    restart: unless-stopped

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: haxxorbunny-whisper
    ports:
      - "8090:8090"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /models/ggml-small.bin ]; then
          echo "[whisper] Downloading ggml-small.bin..."
          wget -O /models/ggml-small.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
        fi
        exec whisper-server --model /models/ggml-small.bin --port 8090 --host 0.0.0.0
    volumes:
      - whisper-models:/models
    restart: unless-stopped

volumes:
  bot-data:
  aiclient-configs:
  searxng-data:
  whisper-models:
